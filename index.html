<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Gestão de Tarefas - Estratégia</title>

  <meta
    name="description"
    content="Gestão de demandas da área de estratégia"
  />

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..800;1,14..32,400..700&family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,500&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- Área de notificações -->
  <div
    id="toast-root"
    class="toast-root"
    aria-live="polite"
    aria-atomic="true"
  ></div>

  <!-- =====================================================
       TELA DE LOGIN
       ===================================================== -->

  <section
    id="login-screen"
    class="screen login-screen is-visible"
    aria-label="Acesso ao sistema"
  >
    <div class="login-screen__art" aria-hidden="true">
      <svg
        class="login-blob"
        viewBox="0 0 600 600"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <linearGradient
            id="blobGrad"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="100%"
          >
            <stop offset="0%" stop-color="#00AE9D" />
            <stop offset="100%" stop-color="#006F5F" />
          </linearGradient>
        </defs>

        <path
          fill="url(#blobGrad)"
          d="M421,67Q481,134,468,217Q455,300,432,372Q409,444,335,470Q261,496,189,463Q117,430,79,358Q41,286,64,206Q87,126,156,79Q225,32,303,30Q381,28,421,67Z"
        />
      </svg>

      <div class="login-screen__brandmark">
        <i data-lucide="palette"></i>
      </div>
    </div>

    <div class="login-screen__panel">
      <div class="login-card">
        <div class="login-card__logo">
          <i data-lucide="layout-dashboard"></i>
          <span>Gestão de Demandas</span>
        </div>

        <p class="login-card__subtitle">
          Gestão de demandas da área de estratégia
        </p>

        <form id="login-form" class="login-form" novalidate>
          <label class="field">
            <span>E-mail</span>

            <input
              type="email"
              name="email"
              required
              autocomplete="username"
              placeholder="voce@sicoob.com.br"
            />
          </label>

          <label class="field">
            <span>Senha</span>

            <input
              type="password"
              name="password"
              required
              autocomplete="current-password"
              placeholder="••••••••"
            />
          </label>

          <p
            id="login-error"
            class="login-error"
            role="alert"
          ></p>

          <button
            type="submit"
            id="login-submit"
            class="btn btn--primary btn--block"
          >
            <span class="btn__label">Entrar</span>

            <i
              data-lucide="loader-2"
              class="btn__spinner"
            ></i>
          </button>
        </form>

        <p class="login-card__hint">
          Acesso restrito à equipe de estratégia da Unicoob Corretora
        </p>
      </div>
    </div>
  </section>

  <!-- =====================================================
       APLICAÇÃO PRINCIPAL
       ===================================================== -->

  <section
    id="app-screen"
    class="screen app-screen"
    aria-label="Gestão de demandas"
  >
    <!-- Cabeçalho -->
    <header class="topbar">
      <div class="topbar__brand">
        <i data-lucide="layout-dashboard"></i>
        <span>Gestão de Demandas</span>
      </div>

      <!-- Alternância de visualização -->
      <nav
        class="view-switchers"
        aria-label="Visualização das demandas"
      >
        <button
          type="button"
          id="btn-kanban-view"
          class="btn active"
          aria-pressed="true"
        >
          <i data-lucide="columns-3"></i>
          Quadro Kanban
        </button>

        <button
          type="button"
          id="btn-calendar-view"
          class="btn"
          aria-pressed="false"
        >
          <i data-lucide="calendar-days"></i>
          Agenda / Calendário
        </button>
      </nav>

      <div class="topbar__actions">
        <button
          type="button"
          id="theme-toggle"
          class="icon-btn"
          aria-label="Alternar tema"
          title="Alternar tema"
        >
          <i data-lucide="sun-moon"></i>
        </button>

        <div class="topbar__user">
          <span
            class="avatar avatar--user"
            id="user-avatar"
            aria-hidden="true"
          >
            --
          </span>

          <span
            id="user-email"
            class="topbar__email"
          ></span>
        </div>

        <button
          type="button"
          id="logout-btn"
          class="icon-btn"
          aria-label="Sair"
          title="Sair"
        >
          <i data-lucide="log-out"></i>
        </button>
      </div>
    </header>

    <!-- Conteúdo principal -->
    <main class="app-main">

      <!-- Dashboard -->
      <section
        class="dashboard"
        id="dashboard"
        aria-label="Indicadores"
      ></section>

      <!-- =================================================
           VISUALIZAÇÃO KANBAN
           ================================================= -->

      <section
        id="kanban-section"
        class="view-section view-section--kanban"
        aria-label="Visualização em quadro Kanban"
      >
        <!-- Busca e filtros -->
        <section
          class="toolbar"
          aria-label="Pesquisa e filtros"
        >
          <div class="toolbar__search">
            <i data-lucide="search"></i>

            <input
              type="search"
              id="search-input"
              placeholder="Buscar por título, tag ou responsável..."
              aria-label="Buscar tarefas"
            />
          </div>

          <div class="toolbar__filters">
            <select
              id="filter-category"
              class="select-control"
              aria-label="Filtrar por categoria"
            >
              <option value="all">Todas as categorias</option>
            </select>

            <select
              id="filter-priority"
              class="select-control"
              aria-label="Filtrar por prioridade"
            >
              <option value="all">Todas as prioridades</option>
            </select>

            <select
              id="filter-assignee"
              class="select-control"
              aria-label="Filtrar por responsável"
            >
              <option value="all">Todos os responsáveis</option>
            </select>

            <select
              id="filter-deadline"
              class="select-control"
              aria-label="Filtrar por prazo"
            >
              <option value="all">Qualquer prazo</option>
              <option value="overdue">Atrasadas</option>
              <option value="due-3">Vencendo em 3 dias</option>
              <option value="due-7">Vencendo em 7 dias</option>
            </select>

            <select
              id="sort-select"
              class="select-control"
              aria-label="Ordenar tarefas"
            >
              <option value="createdAt-desc">
                Mais recentes
              </option>

              <option value="createdAt-asc">
                Mais antigas
              </option>

              <option value="dueDate-asc">
                Prazo mais próximo
              </option>

              <option value="priority-desc">
                Prioridade
              </option>

              <option value="title-asc">
                Título A–Z
              </option>
            </select>

            <button
              type="button"
              id="reset-filters-btn"
              class="icon-btn"
              aria-label="Limpar filtros"
              title="Limpar filtros"
            >
              <i data-lucide="filter-x"></i>
            </button>
          </div>

          <button
            type="button"
            id="new-task-btn"
            class="btn btn--primary"
          >
            <i data-lucide="plus"></i>
            Nova tarefa
          </button>
        </section>

        <!-- Quadro Kanban -->
        <section
          class="kanban-board"
          id="kanban-board"
          aria-label="Quadro Kanban"
        ></section>
      </section>

      <!-- =================================================
           VISUALIZAÇÃO DO CALENDÁRIO
           ================================================= -->

      <section
        id="calendar-section"
        class="view-section view-section--calendar"
        aria-label="Agenda e calendário"
        hidden
      >
        <div id="calendar"></div>
      </section>

    </main>
  </section>

  <!-- =====================================================
       MODAL DE TAREFA
       ===================================================== -->

  <div
    id="modal-overlay"
    class="modal-overlay"
    aria-hidden="true"
  >
    <div
      id="modal-panel"
      class="modal-panel"
      role="dialog"
      aria-modal="true"
      aria-label="Dados da tarefa"
    ></div>
  </div>

  <!-- FullCalendar -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <script>
    window.addEventListener("DOMContentLoaded", function () {
      window.lucide?.createIcons();
    });
  </script>

  <!-- JavaScript principal -->
  <script src="js/main.js"></script>
</body>
</html>
